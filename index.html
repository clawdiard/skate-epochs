<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skate Epochs — Interactive Skateboarding History Timeline</title>
  <meta name="description" content="Explore 70+ years of skateboarding history — from sidewalk surfing to the Olympics — in an interactive visual timeline.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛹</text></svg>">
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #14141f;
      --border: #2a2a3a;
      --text: #e0e0e8;
      --muted: #8888aa;
      --accent: #ff6b35;
      --accent-glow: rgba(255, 107, 53, 0.3);
      --origins: #f4a261;
      --urethane: #e76f51;
      --pool: #2a9d8f;
      --street: #e9c46a;
      --mainstream: #264653;
      --digital: #7209b7;
      --olympic: #06d6a0;
      --future: #ff006e;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }
    header {
      text-align: center;
      padding: 3rem 1.5rem 2rem;
      background: linear-gradient(180deg, rgba(255,107,53,0.08) 0%, transparent 100%);
    }
    header h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--accent), #ff9a5c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header p {
      color: var(--muted);
      font-size: 1.1rem;
      margin-top: 0.5rem;
      max-width: 500px;
      margin-inline: auto;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      padding: 1rem 1.5rem 2rem;
      max-width: 900px;
      margin: 0 auto;
    }
    .filter-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.4rem 1rem;
      border-radius: 2rem;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .timeline-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 1.5rem 4rem;
      position: relative;
    }
    .timeline-line {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 2px;
      background: linear-gradient(180deg, var(--accent), var(--border));
      transform: translateX(-50%);
    }
    @media (max-width: 640px) {
      .timeline-line { left: 1.5rem; }
    }
    .era-label {
      text-align: center;
      padding: 2rem 0 1rem;
      position: relative;
      z-index: 2;
    }
    .era-label span {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.3rem 1.2rem;
      border-radius: 2rem;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
    }
    .event {
      position: relative;
      width: 45%;
      padding: 1.2rem 1.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 2rem;
      transition: all 0.3s ease;
      cursor: default;
      animation: fadeUp 0.5s ease forwards;
      opacity: 0;
    }
    .event:hover {
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
      transform: translateY(-2px);
    }
    .event.left { margin-left: 0; margin-right: auto; }
    .event.right { margin-left: auto; margin-right: 0; }
    .event .dot {
      position: absolute;
      top: 1.5rem;
      width: 14px;
      height: 14px;
      background: var(--accent);
      border-radius: 50%;
      border: 3px solid var(--bg);
      z-index: 3;
    }
    .event.left .dot { right: -7px; transform: translateX(50%); right: calc(-5% - 28px); }
    .event.right .dot { left: -7px; transform: translateX(-50%); left: calc(-5% - 28px); }
    @media (max-width: 640px) {
      .event { width: calc(100% - 3rem); margin-left: 3rem !important; margin-right: 0 !important; }
      .event .dot { left: -2.3rem !important; right: auto !important; transform: none !important; }
      .era-label { text-align: left; padding-left: 3.5rem; }
    }
    .event .year-badge {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 0.3rem;
    }
    .event .icon { font-size: 1.5rem; float: right; margin: -0.2rem 0 0.5rem 0.5rem; }
    .event h3 { font-size: 1rem; font-weight: 700; margin-bottom: 0.4rem; }
    .event p { font-size: 0.88rem; color: var(--muted); line-height: 1.5; }
    .event .tag {
      display: inline-block;
      margin-top: 0.5rem;
      font-size: 0.7rem;
      padding: 0.15rem 0.6rem;
      border-radius: 1rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .tag-culture { background: rgba(244,162,97,0.15); color: #f4a261; }
    .tag-industry { background: rgba(231,111,81,0.15); color: #e76f51; }
    .tag-competition { background: rgba(6,214,160,0.15); color: #06d6a0; }
    .tag-technology { background: rgba(114,9,183,0.15); color: #b57edc; }
    .tag-tricks { background: rgba(233,196,106,0.15); color: #e9c46a; }
    .tag-media { background: rgba(255,0,110,0.15); color: #ff006e; }
    .tag-infrastructure { background: rgba(42,157,143,0.15); color: #2a9d8f; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    footer {
      text-align: center;
      padding: 2rem;
      color: var(--muted);
      font-size: 0.8rem;
      border-top: 1px solid var(--border);
    }
    footer a { color: var(--accent); text-decoration: none; }
    .decade-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10, 10, 15, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0.6rem 1rem;
      display: flex;
      justify-content: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }
    .decade-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.35rem 0.9rem;
      border-radius: 2rem;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .decade-btn:hover, .decade-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    /* Skater Profile Popup */
    .skater-link {
      color: var(--accent);
      cursor: pointer;
      text-decoration: underline;
      text-decoration-style: dotted;
      text-underline-offset: 2px;
      transition: color 0.2s;
    }
    .skater-link:hover { color: #ff9a5c; }
    .skater-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    .skater-overlay.open { opacity: 1; pointer-events: auto; }
    .skater-popup {
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 16px;
      max-width: 420px;
      width: 90%;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 0 40px var(--accent-glow);
      transform: scale(0.9) translateY(20px);
      transition: transform 0.3s ease;
    }
    .skater-overlay.open .skater-popup { transform: scale(1) translateY(0); }
    .skater-popup-header {
      position: relative;
      text-align: center;
      padding: 1.5rem 1.5rem 0;
    }
    .skater-popup-close {
      position: absolute;
      top: 0.8rem;
      right: 0.8rem;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.5rem;
      cursor: pointer;
      line-height: 1;
      transition: color 0.2s;
    }
    .skater-popup-close:hover { color: var(--text); }
    .skater-photo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent);
      margin-bottom: 0.8rem;
      background: var(--bg);
    }
    .skater-photo-fallback {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid var(--accent);
      margin-bottom: 0.8rem;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      margin-inline: auto;
    }
    .skater-popup h2 {
      font-size: 1.3rem;
      font-weight: 800;
      margin-bottom: 0.1rem;
    }
    .skater-popup .skater-nickname {
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 600;
      font-style: italic;
      margin-bottom: 0.6rem;
    }
    .skater-popup-body { padding: 1rem 1.5rem 1.5rem; }
    .skater-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.4rem;
      margin-bottom: 1rem;
      font-size: 0.82rem;
    }
    .skater-meta dt { color: var(--muted); }
    .skater-meta dd { color: var(--text); font-weight: 600; margin: 0; }
    .skater-popup .skater-bio {
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 1rem;
    }
    .skater-section-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 0.4rem;
    }
    .skater-tricks, .skater-accolades {
      list-style: none;
      padding: 0;
      margin-bottom: 1rem;
    }
    .skater-tricks li, .skater-accolades li {
      font-size: 0.82rem;
      color: var(--text);
      padding: 0.2rem 0;
    }
    .skater-tricks li::before { content: '🛹 '; }
    .skater-accolades li::before { content: '🏆 '; }
  </style>
</head>
<body>
  <nav class="decade-nav" id="decadeNav"></nav>
  <header>
    <h1>🛹 Skate Epochs</h1>
    <p>70+ years of skateboarding history — from sidewalk surfing to the Olympics</p>
  </header>
  <div style="text-align:center;padding:0 1.5rem 0.5rem;max-width:500px;margin:0 auto;">
    <input type="text" id="searchInput" placeholder="Search events… (e.g. &quot;ollie&quot;, &quot;Olympics&quot;, &quot;Tony Hawk&quot;)" style="
      width:100%;padding:0.6rem 1.2rem;border-radius:2rem;border:1px solid var(--border);
      background:var(--surface);color:var(--text);font-size:0.95rem;outline:none;
      transition:border-color 0.2s;
    " onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--border)'">
  </div>
  <div class="filters" id="filters"></div>
  <div class="timeline-container">
    <div class="timeline-line"></div>
    <div id="timeline"></div>
  </div>
  <div class="skater-overlay" id="skaterOverlay" onclick="if(event.target===this)closeSkaterPopup()">
    <div class="skater-popup" id="skaterPopup"></div>
  </div>
  <footer>
    <p>Skate Epochs — Built by <a href="https://clawdiard.github.io/clawdia-homepage/">Clawdia</a> 🦞</p>
  </footer>
  <script>
    const categories = ['all','culture','tricks','competition','media','technology','industry','infrastructure'];
    const filtersEl = document.getElementById('filters');
    const timelineEl = document.getElementById('timeline');
    let data = [];
    let skaters = [];
    let activeFilter = 'all';
    let searchQuery = '';

    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', e => {
      searchQuery = e.target.value.toLowerCase().trim();
      render();
    });

    categories.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn' + (c === 'all' ? ' active' : '');
      btn.textContent = c.charAt(0).toUpperCase() + c.slice(1);
      btn.onclick = () => {
        activeFilter = c;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
      };
      filtersEl.appendChild(btn);
    });

    const decadeNavEl = document.getElementById('decadeNav');

    Promise.all([
      fetch('data/timeline.json').then(r => r.json()),
      fetch('data/skaters.json').then(r => r.json())
    ]).then(([timeline, skaterData]) => {
      data = timeline;
      skaters = skaterData;
      render();
      buildDecadeNav();
    });

    // Skater name linking
    function linkSkaterNames(text) {
      let result = text;
      // Sort by name length descending to match longer names first
      const sorted = [...skaters].sort((a, b) => b.name.length - a.name.length);
      sorted.forEach(s => {
        // Also match common references
        const names = [s.name];
        // Add last name match for uniqueness
        const escaped = s.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const re = new RegExp(`\\b(${escaped})\\b`, 'g');
        result = result.replace(re, `<span class="skater-link" data-skater="${s.name}" onclick="showSkaterPopup('${s.name.replace(/'/g, "\\'")}')">$1</span>`);
      });
      return result;
    }

    function showSkaterPopup(name) {
      const s = skaters.find(sk => sk.name === name);
      if (!s) return;
      const overlay = document.getElementById('skaterOverlay');
      const popup = document.getElementById('skaterPopup');
      const lifespan = s.died ? `${s.born}–${s.died}` : `Born ${s.born}`;
      popup.innerHTML = `
        <div class="skater-popup-header">
          <button class="skater-popup-close" onclick="closeSkaterPopup()">&times;</button>
          <div class="skater-photo-fallback" id="photoContainer">🛹</div>
          <h2>${s.name}</h2>
          ${s.nickname ? `<div class="skater-nickname">"${s.nickname}"</div>` : ''}
        </div>
        <div class="skater-popup-body">
          <div class="skater-meta">
            <dt>Years</dt><dd>${lifespan}</dd>
            <dt>Hometown</dt><dd>${s.hometown}</dd>
            <dt>Stance</dt><dd>${s.stance}</dd>
            <dt>Era</dt><dd>${s.era}</dd>
          </div>
          <p class="skater-bio">${s.bio}</p>
          ${s.signature_tricks && s.signature_tricks.length ? `
            <div class="skater-section-title">Signature Tricks</div>
            <ul class="skater-tricks">${s.signature_tricks.map(t => `<li>${t}</li>`).join('')}</ul>
          ` : ''}
          ${s.accolades && s.accolades.length ? `
            <div class="skater-section-title">Accolades</div>
            <ul class="skater-accolades">${s.accolades.map(a => `<li>${a}</li>`).join('')}</ul>
          ` : ''}
        </div>
      `;
      // Try loading photo
      if (s.photo) {
        const img = new Image();
        img.className = 'skater-photo';
        img.alt = s.name;
        img.onload = () => {
          const container = document.getElementById('photoContainer');
          if (container) { container.replaceWith(img); }
        };
        img.src = s.photo;
      }
      overlay.classList.add('open');
      document.addEventListener('keydown', escHandler);
    }

    function closeSkaterPopup() {
      document.getElementById('skaterOverlay').classList.remove('open');
      document.removeEventListener('keydown', escHandler);
    }

    function escHandler(e) { if (e.key === 'Escape') closeSkaterPopup(); }

    function buildDecadeNav() {
      const decades = [...new Set(data.map(e => Math.floor(e.year / 10) * 10))].sort((a, b) => a - b);
      decadeNavEl.innerHTML = '';
      decades.forEach(dec => {
        const btn = document.createElement('button');
        btn.className = 'decade-btn';
        btn.textContent = dec + 's';
        btn.onclick = () => {
          const target = document.getElementById('decade-' + dec);
          if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };
        decadeNavEl.appendChild(btn);
      });
      // Also add era jump buttons
      const eras = [];
      data.forEach(e => { if (!eras.includes(e.era)) eras.push(e.era); });
      if (eras.length) {
        const sep = document.createElement('span');
        sep.style.cssText = 'width:1px;height:1.2rem;background:var(--border);align-self:center;margin:0 0.3rem';
        decadeNavEl.appendChild(sep);
      }
      eras.forEach(era => {
        const btn = document.createElement('button');
        btn.className = 'decade-btn';
        btn.style.borderColor = 'var(--accent)';
        btn.style.color = 'var(--accent)';
        btn.textContent = era;
        btn.onclick = () => {
          const slug = 'era-' + era.toLowerCase().replace(/[^a-z0-9]+/g, '-');
          const target = document.getElementById(slug);
          if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };
        decadeNavEl.appendChild(btn);
      });
      // Highlight active decade on scroll
      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting && entry.target.id.startsWith('decade-')) {
            const dec = entry.target.id.replace('decade-', '');
            decadeNavEl.querySelectorAll('.decade-btn').forEach(b => {
              b.classList.toggle('active', b.textContent === dec + 's');
            });
          }
        });
      }, { rootMargin: '-40% 0px -50% 0px' });
      document.querySelectorAll('[id^="decade-"]').forEach(el => observer.observe(el));
    }

    function render() {
      let filtered = activeFilter === 'all' ? data : data.filter(e => e.category === activeFilter);
      if (searchQuery) {
        filtered = filtered.filter(e =>
          e.title.toLowerCase().includes(searchQuery) ||
          e.description.toLowerCase().includes(searchQuery) ||
          e.era.toLowerCase().includes(searchQuery) ||
          String(e.year).includes(searchQuery)
        );
      }
      let html = '';
      let lastEra = '';
      let lastDecade = -1;
      filtered.forEach((e, i) => {
        const decade = Math.floor(e.year / 10) * 10;
        if (decade !== lastDecade) {
          lastDecade = decade;
          html += `<div id="decade-${decade}" style="scroll-margin-top:4rem"></div>`;
        }
        if (e.era !== lastEra) {
          lastEra = e.era;
          const slug = 'era-' + e.era.toLowerCase().replace(/[^a-z0-9]+/g, '-');
          html += `<div class="era-label" id="${slug}" style="scroll-margin-top:4rem"><span>${e.era}</span></div>`;
        }
        const side = i % 2 === 0 ? 'left' : 'right';
        html += `
          <div class="event ${side}" style="animation-delay: ${i * 0.05}s">
            <div class="dot"></div>
            <div class="icon">${e.icon}</div>
            <div class="year-badge">${e.year}</div>
            <h3>${e.title}</h3>
            <p>${linkSkaterNames(e.description)}</p>
            <span class="tag tag-${e.category}">${e.category}</span>
          </div>`;
      });
      timelineEl.innerHTML = html;
    }
  </script>
</body>
</html>
